<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mitos de Chiloé — Trece juegos del archipiélago</title>
    <style>
      :root {
        --bg: #06090c;
        --panel: #0a1014;
        --ink: #e8dcc0;
        --ink-dim: #9a917c;
        --glow: #9fffd0;
        --line: #2a3a3a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: radial-gradient(120% 90% at 50% 0%, #0c141a 0%, var(--bg) 60%);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
        min-height: 100vh;
        padding: 48px 24px 80px;
      }
      .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(80% 70% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%);
      }
      header { text-align: center; margin-bottom: 10px; }
      header .charm { color: var(--glow); font-size: 18px; letter-spacing: 8px; }
      h1 {
        font-size: clamp(34px, 6vw, 64px);
        letter-spacing: 0.18em;
        font-weight: normal;
        margin: 10px 0 6px;
        text-shadow: 0 0 24px rgba(159, 255, 208, 0.12);
      }
      .sub { color: var(--glow); font-style: italic; letter-spacing: 0.08em; opacity: 0.8; }
      .count {
        margin: 18px auto 38px; text-align: center; color: var(--ink-dim);
        letter-spacing: 0.25em; font-variant: small-caps; font-size: 14px;
      }
      .count b { color: var(--glow); font-weight: normal; }
      .grid {
        display: grid; gap: 18px; max-width: 1180px; margin: 0 auto;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      }
      a.card {
        display: block; position: relative; text-decoration: none; color: inherit;
        background: linear-gradient(160deg, rgba(20,30,34,0.6), rgba(8,12,15,0.9));
        border: 1px solid var(--line);
        outline: 1px solid rgba(0,0,0,0.6);
        outline-offset: 3px;
        padding: 0 0 18px;
        overflow: hidden;
        transition: border-color 0.35s, transform 0.35s, box-shadow 0.35s;
      }
      .card-art {
        height: 150px; margin-bottom: 16px;
        background:
          linear-gradient(to top, rgba(8,12,15,1) 0%, rgba(8,12,15,0) 35%),
          var(--art, linear-gradient(160deg, #11202a 0%, #0a1014 70%));
        background-size: cover; background-position: center 30%;
        filter: saturate(0.9);
        transition: filter 0.35s;
      }
      a.card:hover .card-art { filter: saturate(1.05) brightness(1.08); }
      .card.flagship .card-art { height: 230px; }
      .card-body { padding: 0 24px; }
      a.card:hover {
        border-color: var(--glow);
        transform: translateY(-3px);
        box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 24px rgba(159,255,208,0.07);
      }
      .card h2 { font-size: 21px; letter-spacing: 0.14em; font-weight: normal; }
      .card .epithet { color: var(--glow); font-style: italic; font-size: 13.5px; margin: 4px 0 10px; opacity: 0.85; }
      .card p { color: var(--ink-dim); font-size: 14.5px; line-height: 1.5; min-height: 44px; }
      .card .tag {
        display: inline-block; margin-top: 14px; font-size: 11px; letter-spacing: 0.22em;
        color: var(--ink-dim); border: 1px solid var(--line); padding: 4px 10px;
        font-variant: small-caps;
      }
      .card .done {
        position: absolute; top: 14px; right: 16px; color: var(--glow);
        font-size: 18px; text-shadow: 0 0 12px rgba(159,255,208,0.7);
        display: none;
      }
      .card.completed .done { display: block; }
      .card.flagship { grid-column: 1 / -1; }
      .card.flagship h2 { font-size: 30px; }
      .card.flagship p { min-height: 0; max-width: 720px; }
      footer { text-align: center; margin-top: 48px; color: var(--ink-dim); font-size: 12.5px; letter-spacing: 0.12em; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="vignette"></div>
    <header>
      <div class="charm">✦</div>
      <h1>MITOS DE CHILOÉ</h1>
      <div class="sub">Trece juegos del archipiélago</div>
    </header>
    <div class="count" id="count"></div>
    <main class="grid" id="grid"></main>
    <footer>Chiloé, Chile · la niebla no devuelve lo que toma</footer>
    <script>
      const GAMES = [
        { id: 'caleuche', title: 'CALEUCHE', sub: 'La niebla no devuelve lo que toma', tag: 'horror · exploración', flagship: true,
          blurb: 'El bote de tu hermano volvió vacío. Recorre la isla a oscuras, recibe las señas de sus seis seres y aborda el barco fantasma que se lo llevó.' },
        { id: 'pincoya', title: 'LA PINCOYA', sub: 'Marea alta', tag: 'pesca · timing',
          blurb: 'Ella danza en la playa y el mar obedece. Lanza las redes solo cuando mire hacia el agua — y llena la bodega antes del alba.' },
        { id: 'trauco', title: 'EL TRAUCO', sub: 'No le sostengas la mirada', tag: 'sigilo',
          blurb: 'Junta quilineja en su bosque. Quédate fuera de su mirada, o tu voluntad se dobla como madera verde.' },
        { id: 'camahueto', title: 'EL CAMAHUETO', sub: 'La bajada', tag: 'carrera',
          blurb: 'El ternero de un cuerno baja esta noche rasgando la tierra hacia el mar. Corre la quebrada tras él y sobrevive.' },
        { id: 'sirena', title: 'LA SIRENA', sub: 'El canto', tag: 'memoria · música',
          blurb: 'Ella canta sobre el agua los nombres de los ahogados. Repite su canto, nota por nota, y guíalos a casa.' },
        { id: 'invunche', title: 'EL INVUNCHE', sub: 'La cueva de Quicaví', tag: 'horror · laberinto',
          blurb: 'Una vela, una cueva que nadie ha trazado, y la cosa que los brujos hicieron para que nunca saliera.' },
        { id: 'basilisco', title: 'EL BASILISCO', sub: 'La noche del huevo', tag: 'defensa',
          blurb: 'Algo salió del cascarón bajo el entablado y bebe el aliento de los que duermen. Mantén los fuegos encendidos. Encuentra el huevo.' },
        { id: 'tenten', title: 'TENTEN Y CAICAI', sub: 'Las dos serpientes', tag: 'puzzle',
          blurb: 'Caicai Vilu alza el mar contra la tierra. Ayuda a Tenten Vilu a levantar los cerros antes de que el agua se lleve a los isleños.' },
        { id: 'brujo', title: 'EL VUELO DEL BRUJO', sub: 'Macuñ', tag: 'vuelo',
          blurb: 'Ponte el chaleco de piel y vuela los canales de la noche. La reunión en Quicaví no espera más allá de la puesta de la luna.' },
        { id: 'cuchivilu', title: 'EL CUCHIVILU', sub: 'El corral roto', tag: 'arcade',
          blurb: 'La marea trae los peces y la culebra-chancho rompe el corral. Arrea a unos, pelea con la otra, termina antes del alba.' },
        { id: 'fiura', title: 'LA FIURA', sub: 'El pantanal', tag: 'plataforma',
          blurb: 'Cruza su pantano de tronco en tronco que se hunde, corre entre los pulsos de su embrujo y trae a la machi las cinco hierbas.' },
        { id: 'quicavi', title: 'EL BRUJO DE QUICAVÍ', sub: 'Las siete páginas', tag: 'horror · páginas',
          blurb: 'Siete páginas de pergamino de piel están clavadas en el bosque negro. Algo las cuida, y siempre está detrás de ti.' },
        { id: 'piuchen', title: 'EL PIUCHÉN', sub: 'La majada', tag: 'arcade · puntería',
          blurb: 'La serpiente alada cae desde las estrellas por tus ovejas. Una honda, cinco oleadas, el alba o nada.' },
      ]
      const grid = document.getElementById('grid')
      let done = 0
      for (const g of GAMES) {
        const isDone = localStorage.getItem('chiloe-' + g.id + '-done') === '1'
        if (isDone) done++
        const a = document.createElement('a')
        a.className = 'card' + (g.flagship ? ' flagship' : '') + (isDone ? ' completed' : '')
        a.href = '/games/' + g.id + '.html'
        a.innerHTML = '<span class="done">✦</span>' +
          '<div class="card-art" style="--art:url(/assets/cards/' + g.id + '.png)"></div>' +
          '<div class="card-body"><h2>' + g.title + '</h2>' +
          '<div class="epithet">' + g.sub + '</div>' +
          '<p>' + g.blurb + '</p>' +
          '<span class="tag">' + g.tag + '</span></div>'
        grid.appendChild(a)
      }
      document.getElementById('count').innerHTML =
        'señas <b>✦ ' + done + '/' + GAMES.length + '</b> reunidas'
    </script>
  </body>
</html>
